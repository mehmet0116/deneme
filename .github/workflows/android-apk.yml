name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to repo folder
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/codex-apk-test-debug.apk

      - name: Commit APK into repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Add built debug APK
          file_pattern: apk/codex-apk-test-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-apk-test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
